name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.2)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            V=$(node -p "require('./package.json').version")
            TAG="v$V"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "resolved $TAG"

      - name: Skip if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches package.json
        if: steps.exists.outputs.skip == 'false'
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$V" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::package.json is $V but the release tag is ${{ steps.meta.outputs.version }}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.skip == 'false'
        with:
          node-version: 20
          cache: npm

      - if: steps.exists.outputs.skip == 'false'
        run: npm ci --no-audit --no-fund
      - if: steps.exists.outputs.skip == 'false'
        run: npm run build

      - name: Package source
        if: steps.exists.outputs.skip == 'false'
        run: |
          V="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="troll-surveillance-$V/" -o "dist/troll-surveillance-$V.tar.gz" HEAD
          ( cd dist && shasum -a 256 "troll-surveillance-$V.tar.gz" > "troll-surveillance-$V.tar.gz.sha256" )
          ls -lh dist

      - name: Check release notes format
        if: steps.exists.outputs.skip == 'false'
        run: |
          V="${{ steps.meta.outputs.version }}"
          NOTES="docs/releases/v$V.md"
          if [ -f "$NOTES" ]; then
            ./scripts/check-release-notes.sh "$NOTES"
            echo "notes_file=$NOTES" >> "$GITHUB_ENV"
          else
            echo "::warning::No docs/releases/v$V.md found, falling back to auto-generated notes"
            echo "notes_file=" >> "$GITHUB_ENV"
          fi

      - name: Create tag when publishing from a branch
        if: steps.exists.outputs.skip == 'false' && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Troll Surveillance $TAG"
          git push origin "$TAG"

      - name: Publish release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          V="${{ steps.meta.outputs.version }}"
          ARGS=( "$TAG" "dist/troll-surveillance-$V.tar.gz" "dist/troll-surveillance-$V.tar.gz.sha256" --title "Troll Surveillance $TAG" )
          if [ -n "${notes_file:-}" ]; then
            ARGS+=( --notes-file "$notes_file" )
          else
            ARGS+=( --generate-notes )
          fi
          gh release create "${ARGS[@]}"
