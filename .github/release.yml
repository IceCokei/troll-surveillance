changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: ✨ 新增
      labels:
        - enhancement
        - feature
        - new
    - title: 🐛 修复
      labels:
        - bug
        - fix
        - regression
    - title: 🚀 功能
      labels:
        - area/core
        - area/ui
        - area/data
    - title: ⚠️ 破坏性变更
      labels:
        - breaking
    - title: 📝 文档
      labels:
        - documentation
        - docs
    - title: 🧰 其他
      labels:
        - '*'
